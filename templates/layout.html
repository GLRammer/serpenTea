{{define "layout"}}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{.Title}}</title>
    {{if .Style}}
        <link rel="stylesheet" href="/static/css/{{.Style}}?v=0.1">
    {{end}}
    <link rel="stylesheet" href="/static/css/style.css?v=0.1">
</head>
<body>
  <div class="page">
    <header>
      <div class="container">
        <div class="navbar">
          <a class="brand" href="/" aria-label="Serpentea home">
            <img class="brand-mark" src="static/images/logo.png" alt="Serpentea logo provided by artist Angel Thao">
            <div>
              <h1>Serpentea</h1>
              <p>Freelance Programming</p>
            </div>
          </a>

          <nav aria-label="Primary navigation">
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
          </nav>

          <a class="button primary" href="mailto:consult@serpentea.net">Start a Project</a>
        </div>
      </div>
    </header>

    <main>
        {{template "content" .}}
    </main>
</div>
</body>
<footer>
    <div class="container">
    <p>© 2026 Serpentea. Freelance programming, development, and custom software.</p>
    </div>
</footer>
</html>
{{end}}
